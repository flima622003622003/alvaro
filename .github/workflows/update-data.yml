name: Update Brazilian population data

on:
  # US Census Bureau typically publishes new ACS 1-year estimates in mid-September.
  # Run weekly all year to catch the release automatically (it can slip past September);
  # it's a no-op (nothing committed) on weeks the new year isn't out yet, and the
  # run fails (red) if the Census request itself fails, so a broken fetch is visible.
  schedule:
    - cron: "0 13 * * 1" # every Monday at 13:00 UTC
  workflow_dispatch:
    inputs:
      year:
        description: "Specific ACS year to fetch (leave empty to try the next year after the latest on file)"
        required: false
        type: string

permissions:
  contents: write # commit the updated dataset
  actions: write  # keep this schedule from being auto-disabled (see last step)
  pages: write    # ask GitHub Pages to republish after a data commit

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Fetch latest ACS data
        run: node scripts/update-data.mjs ${{ inputs.year }}

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/population.json; then
            echo "No new data published yet."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/population.json
          git commit -m "data: update Brazilian population dataset"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN may not start the Pages build on its own,
      # so request it explicitly - otherwise the new year would sit in the repo
      # without reaching the published dashboard.
      - name: Republish GitHub Pages
        if: steps.commit.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

      # GitHub disables scheduled workflows in public repos after 60 days without
      # repository activity, and this one only commits once a year. Re-enabling
      # it on every run resets that clock, so the schedule never lapses.
      - name: Keep the weekly schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-data.yml/enable"
